[workspace]
resolver = "2"
members = [
    "crates/mlb-core",
    "crates/mlb-odds-client",
    "crates/mlb-db",
    "crates/mlb-llm",
    "crates/mlb-stats-client",
    "crates/mlb-predict",
    "bins/mlb-cli",
    "bins/mlb-server",
]

[workspace.package]
version = "0.1.0"
edition = "2021"
rust-version = "1.75"
license = "MIT"
repository = "https://github.com/yourusername/Rust-MLB-Sports-Betting"

[workspace.dependencies]
# Async runtime
tokio = { version = "1.36", features = ["full"] }

# Serialization
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"

# HTTP client
reqwest = { version = "0.12", features = ["json", "rustls-tls"] }

# Database
sqlx = { version = "0.8", features = ["runtime-tokio", "sqlite", "chrono", "rust_decimal"] }

# CLI
clap = { version = "4.5", features = ["derive", "env"] }

# HTTP server (chat/parlay API)
axum = "0.7"
tower-http = { version = "0.5", features = ["cors"] }

# Error handling
thiserror = "1.0"
anyhow = "1.0"

# Logging
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }

# Date/time
chrono = { version = "0.4", features = ["serde"] }

# Precise decimal math for odds/money
rust_decimal = { version = "1.34", features = ["serde", "serde-with-str"] }

# Configuration
dotenvy = "0.15"

# Testing
tokio-test = "0.4"

# Internal crates
mlb-core = { path = "crates/mlb-core" }
mlb-odds-client = { path = "crates/mlb-odds-client" }
mlb-db = { path = "crates/mlb-db" }
mlb-llm = { path = "crates/mlb-llm" }
mlb-stats-client = { path = "crates/mlb-stats-client" }
mlb-predict = { path = "crates/mlb-predict" }
